[package]
name = "hotsheet"
version = "0.20.0"
description = "Hot Sheet desktop app"
edition = "2021"

[lib]
name = "hotsheet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
tauri-plugin-opener = "2.5.3"
tauri-plugin-notification = "2"
# HS-9307 (docs/112 §112.5.1) — the loopback mTLS proxy for the desktop remote
# client. `reqwest` (rustls, no OpenSSL → cross-platform) presents the client-auth
# cert + trusts the per-project CA on the outbound handshake the WebView can't do;
# `axum` runs the loopback (127.0.0.1) plain-HTTP server the WebView hits. The
# WebSocket-proxy leg (tokio-tungstenite + a shared rustls config) is a follow-up.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
axum = { version = "0.8", features = ["ws"] }
# HS-9309 — the WS-proxy leg. tokio-tungstenite dials the remote `wss://` with a
# shared rustls 0.23 ClientConfig (client-auth cert + project CA root); axum's `ws`
# feature accepts the loopback upgrade. All three pin rustls 0.23 for interop.
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = "0.23"
rustls-pemfile = "2"
futures-util = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSBezierPath", "NSGraphics", "NSGraphicsContext", "NSColor", "NSShadow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }
objc2-core-foundation = { version = "0.3", features = ["objc2"] }
